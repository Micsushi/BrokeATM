<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Budget | BrokeATM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/main.css?v=16" />
  <style>
    /* Category budget table */
    .budget-page .bulk-bar {
      gap: 0.75rem;
      padding: 0.72rem 0.9rem;
      margin-bottom: 0.85rem;
    }
    .budget-page .bulk-count { font-size: var(--font-size-body); }
    .budget-hint-bar {
      justify-content: flex-end;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 0.65rem;
    }
    .budget-hint-chip {
      margin: 0;
      padding: 0.48rem 0.9rem;
      font-size: var(--font-size-caption);
      border-radius: 8px;
    }
    .budget-table { width: 100%; border-collapse: collapse; }
    .budget-table th {
      font-size: var(--font-size-table-head); font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.06em; color: var(--text-muted);
      padding: 0 0.75rem 0.7rem; text-align: left;
    }
    .budget-table th.right { text-align: right; }
    .budget-table td {
      padding: 0.62rem 0.75rem;
      vertical-align: middle;
      border-top: 1px solid rgba(255,255,255,0.04);
      font-size: var(--font-size-table-cell);
    }
    .budget-table tr:first-child td { border-top: none; }
    .cat-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 0.4rem; flex-shrink: 0; }
    .budget-avg { font-family: 'JetBrains Mono', monospace; font-size: var(--font-size-body-sm); color: var(--text-muted); }
    .limit-input {
      width: 112px; background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); font-size: var(--control-font-sm);
      min-height: var(--control-height-sm);
      padding: var(--control-pad-sm-y) var(--control-pad-sm-x); text-align: right;
      transition: border-color 0.15s;
    }
    .limit-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(124,130,255,0.15); }
    .total-budget-input {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); font-size: var(--control-font-sm); font-weight: 700;
      min-height: var(--control-height-sm);
      padding: var(--control-pad-sm-y) var(--control-pad-sm-x); text-align: right;
      transition: border-color 0.15s;
    }
    .total-budget-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(124,130,255,0.15); }
    .total-budget-input.invalid { border-color: var(--danger); box-shadow: 0 0 0 3px rgba(239,68,68,0.15); }
    .validation-hint { font-size: var(--font-size-caption); color: var(--danger); margin-top: 0.5rem; min-height: 1.1em; }
    .others-hint { font-size: var(--font-size-caption); color: var(--text-muted); margin-top: 0.3rem; }
    .save-status {
      font-size: var(--font-size-caption);
      color: var(--text-muted);
      min-height: 1.1em;
      min-width: 70px;
      transition: color 0.3s;
      display: inline-flex;
      align-items: center;
    }
    .save-status.saving { color: var(--text-muted); }
    .save-status.saved { color: #22c55e; }
    .save-status.error { color: var(--danger); }

    .budget-table tbody tr { position: relative; }
    .budget-table tbody tr.selected td { background: rgba(99,102,241,0.07); }
    .cat-name-cell { display: flex; align-items: center; gap: 0.35rem; font-size: var(--font-size-body); font-weight: 600; }
    .cat-name-cell .cat-dot { margin-right: 0; }
    .budget-row-chk { cursor: pointer; accent-color: var(--accent); width: 16px; height: 16px; flex-shrink: 0; }
    .budget-table th.chk-col, .budget-table td.chk-col { width: 28px; padding-right: 0; text-align: center; }
    .add-cat-wrap { position: relative; display: inline-block; }
    .budget-spacer { flex: 1; }
    .budget-total-wrap { display: flex; align-items: center; gap: 0.6rem; flex-shrink: 0; flex-wrap: wrap; }
    .budget-total-label { font-size: var(--font-size-caption); color: var(--text-muted); white-space: nowrap; }
    .budget-table-card { margin-bottom: 1.05rem; }
    .cat-dropdown {
      position: absolute; top: calc(100% + 4px); left: 0;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; min-width: 200px; max-height: 260px;
      overflow-y: auto; z-index: 100;
      box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    }
    .cat-dropdown.hidden { display: none; }
    .cat-dropdown-item {
      display: flex; align-items: center; gap: 0.5rem;
      padding: 0.6rem 0.85rem; cursor: pointer; font-size: var(--font-size-body-sm);
      transition: background 0.1s;
    }
    .cat-dropdown-item:hover { background: rgba(255,255,255,0.06); }
    .cat-dropdown-empty { padding: 0.85rem; font-size: var(--font-size-caption); color: var(--text-muted); text-align: center; }
  </style>
</head>
<body>
<nav>
  <span class="nav-brand">💸 BrokeATM</span>
  <div class="nav-links">
    <a href="/">Dashboard</a>
    <a href="/records">Records</a>
    <a href="/budget" class="active">Budget</a>
    <a href="/categories">Categories</a>
    <a href="/import">Import</a>
    <a href="/settings">Settings</a>
  </div>
</nav>

<div class="page budget-page">
  <div class="page-header">
    <div>
      <h1>Budget</h1>
      <p>Set spending limits per category and track your progress</p>
    </div>
  </div>

  <div id="alerts"></div>

  <!-- Unallocated / validation hint -->
  <div id="budget-hint-bar" class="budget-hint-bar" style="display:none">
    <div id="others-hint" class="alert alert-warning budget-hint-chip"></div>
    <div id="validation-hint" class="alert alert-error budget-hint-chip" style="display:none"></div>
  </div>

  <!-- Bulk action bar (always visible) -->
  <div class="bulk-bar" id="budget-bulk-bar">
    <span class="bulk-count" id="budget-bulk-count">0 selected</span>
    <button class="btn btn-ghost btn-sm" id="btn-budget-select-all">Select All</button>
    <button class="btn btn-ghost btn-sm" id="btn-budget-deselect">Clear All</button>
    <div class="bulk-divider"></div>
    <div class="add-cat-wrap">
      <button class="btn btn-ghost btn-sm" id="btn-add-cat">+ Add category</button>
      <div class="cat-dropdown hidden" id="cat-dropdown"></div>
    </div>
    <button class="btn btn-danger btn-sm" id="btn-budget-bulk-delete" disabled>Delete selected</button>
    <div class="budget-spacer"></div>
    <div class="budget-total-wrap">
      <span class="budget-total-label">Total budget</span>
      <input type="number" class="total-budget-input" id="total-budget" min="0" step="1" placeholder="—" />
      <div class="save-status" id="save-status"></div>
    </div>
  </div>

  <!-- ── Category limits table ─────────────────────────────────────── -->
  <div class="card budget-table-card">
    <table class="budget-table" id="budget-table">
      <thead>
        <tr>
          <th class="chk-col"></th>
          <th>Category</th>
          <th class="right">6 mo avg</th>
          <th class="right">3 mo avg</th>
          <th class="right">Last mo</th>
          <th class="right">Limit</th>
        </tr>
      </thead>
      <tbody id="budget-tbody">
        <tr><td colspan="6" style="text-align:center;padding:2rem;color:var(--text-muted)">Loading…</td></tr>
      </tbody>
    </table>
  </div>

</div>

<script src="/static/js/utils.js?v=9"></script>
<script src="/static/js/api.js?v=8"></script>
<script>
let currentSettings = null;
let saveTimer = null;

// ── Auto-save (debounced 800ms) ────────────────────────────────────────────────

function scheduleSave() {
  const status = document.getElementById("save-status");
  status.textContent = "Saving…";
  status.className = "save-status saving";
  clearTimeout(saveTimer);
  saveTimer = setTimeout(doSave, 800);
}

async function doSave() {
  const limits = getCategoryLimits();
  const totalVal = parseFloat(document.getElementById("total-budget").value);
  const catSum = limits.reduce((s, r) => s + r.limit_amount, 0);
  const status = document.getElementById("save-status");

  if (!isNaN(totalVal) && totalVal < catSum) {
    status.textContent = `Total must be ≥ ${fmtCurrency(catSum)}`;
    status.className = "save-status error";
    return;
  }

  try {
    const r = await fetch("/api/budget/settings", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        total: isNaN(totalVal) ? null : totalVal,
        rules: limits,
      }),
    });
    if (!r.ok) throw new Error(await r.text());
    status.textContent = "Saved";
    status.className = "save-status saved";
    setTimeout(() => { status.textContent = ""; status.className = "save-status"; }, 2000);
  } catch (e) {
    status.textContent = "Save failed";
    status.className = "save-status error";
  }
}

// ── Load settings (top panel) ─────────────────────────────────────────────────

async function loadSettings() {
  try {
    const r = await fetch(`/api/budget/settings`);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const data = await r.json();
    currentSettings = data;
    renderBudgetTable(data);
    updateTotalHint();
  } catch (e) {
    const tbody = document.getElementById("budget-tbody");
    tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:2rem;color:var(--danger)">Failed to load: ${e.message}</td></tr>`;
  }
}

function fmtAvg(val) {
  return `<span class="budget-avg">${fmtCurrency(val, undefined, { minimumFractionDigits: 0, maximumFractionDigits: 0 })}</span>`;
}

// ── Bulk selection ────────────────────────────────────────────────────────────

let selectedCatIds = new Set();

function updateBulkBar() {
  const n = selectedCatIds.size;
  document.getElementById("budget-bulk-count").textContent = `${n} selected`;
  document.getElementById("btn-budget-bulk-delete").disabled = n === 0;
}

function toggleRowSelect(tr, checked) {
  const id = tr.dataset.catId;
  if (!id) return;
  if (checked) { selectedCatIds.add(id); tr.classList.add("selected"); }
  else { selectedCatIds.delete(id); tr.classList.remove("selected"); }
  updateBulkBar();
}

function buildCatRow(catId, catName, catColor, avg6, avg3, avg1, limitVal) {
  const dot = catColor
    ? `<span class="cat-dot" style="background:${escHtml(catColor)}"></span>`
    : `<span class="cat-dot" style="background:var(--border)"></span>`;
  const tr = document.createElement("tr");
  tr.dataset.catId = catId ?? "";
  tr.innerHTML = `
    <td class="chk-col"><input type="checkbox" class="budget-row-chk" /></td>
    <td><div class="cat-name-cell">${dot}${escHtml(catName)}</div></td>
    <td style="text-align:right">${fmtAvg(avg6)}</td>
    <td style="text-align:right">${fmtAvg(avg3)}</td>
    <td style="text-align:right">${fmtAvg(avg1)}</td>
    <td style="text-align:right">
      <input type="number" class="limit-input" data-cat-id="${catId ?? ""}"
        min="0" step="1" placeholder="—" value="${limitVal}" />
    </td>`;
  wireRow(tr);
  return tr;
}

function wireRow(tr) {
  tr.querySelector(".limit-input").addEventListener("input", () => { updateTotalHint(); scheduleSave(); });
  tr.querySelector(".budget-row-chk").addEventListener("change", e => toggleRowSelect(tr, e.target.checked));
}

function renderBudgetTable(data) {
  selectedCatIds.clear();
  const tbody = document.getElementById("budget-tbody");
  tbody.innerHTML = "";

  data.categories.forEach(c => {
    const avg6 = c.avg_6m ?? c.avg_monthly ?? 0;
    const avg3 = c.avg_3m ?? 0;
    const avg1 = c.avg_1m ?? 0;
    const limitVal = c.limit_amount != null ? c.limit_amount : "";
    tbody.appendChild(buildCatRow(c.category_id, c.category_name, c.category_color, avg6, avg3, avg1, limitVal));
  });

  const totalEl = document.getElementById("total-budget");
  if (data.total != null) totalEl.value = data.total;
  updateBulkBar();
}

function getCategoryLimits() {
  const limits = [];
  document.querySelectorAll("#budget-tbody .limit-input").forEach(el => {
    const val = parseFloat(el.value);
    const catId = el.dataset.catId;
    if (!isNaN(val) && val >= 0 && catId !== "") {
      limits.push({ category_id: parseInt(catId), limit_amount: val });
    }
  });
  return limits;
}

function updateTotalHint() {
  const limits = getCategoryLimits();
  const catSum = limits.reduce((s, r) => s + r.limit_amount, 0);
  const totalEl = document.getElementById("total-budget");
  const totalVal = parseFloat(totalEl.value);
  const hint = document.getElementById("validation-hint");
  const others = document.getElementById("others-hint");
  const hintBar = document.getElementById("budget-hint-bar");

  hint.style.display = "none";
  others.style.display = "none";
  hintBar.style.display = "none";
  totalEl.classList.remove("invalid");

  if (!isNaN(totalVal)) {
    const diff = totalVal - catSum;
    if (diff < 0) {
      hint.textContent = `Total must be ≥ category sum (${fmtCurrency(catSum)})`;
      hint.style.display = "";
      hintBar.style.display = "flex";
      totalEl.classList.add("invalid");
    } else if (diff > 0) {
      others.textContent = `${fmtCurrency(diff)} unallocated → "Others"`;
      others.style.display = "";
      hintBar.style.display = "flex";
    }
  }
}

// ── Add category dropdown ─────────────────────────────────────────────────────

let allCategories = [];

async function loadAllCategories() {
  if (allCategories.length === 0) {
    allCategories = await fetch("/api/categories").then(r => r.json());
  }
}

function getExistingCatIds() {
  return new Set(
    [...document.querySelectorAll("#budget-tbody tr[data-cat-id]")]
      .map(tr => parseInt(tr.dataset.catId))
      .filter(id => !isNaN(id))
  );
}

async function openAddCatDropdown() {
  const dropdown = document.getElementById("cat-dropdown");
  if (!dropdown.classList.contains("hidden")) {
    dropdown.classList.add("hidden");
    return;
  }
  await loadAllCategories();
  const existing = getExistingCatIds();
  const missing = allCategories.filter(c => !existing.has(c.id));
  if (missing.length === 0) {
    dropdown.innerHTML = `<div class="cat-dropdown-empty">All categories added</div>`;
  } else {
    dropdown.innerHTML = missing.map(c => {
      const dot = c.color
        ? `<span class="cat-dot" style="background:${escHtml(c.color)}"></span>`
        : `<span class="cat-dot" style="background:var(--border)"></span>`;
      return `<div class="cat-dropdown-item" data-cat-id="${c.id}" data-cat-name="${escHtml(c.name)}" data-cat-color="${escHtml(c.color || '')}">
        ${dot}${escHtml(c.name)}
      </div>`;
    }).join("");
    dropdown.querySelectorAll(".cat-dropdown-item").forEach(el => {
      el.addEventListener("click", () => {
        addCategoryRow(parseInt(el.dataset.catId), el.dataset.catName, el.dataset.catColor || null);
        dropdown.classList.add("hidden");
      });
    });
  }
  dropdown.classList.remove("hidden");
}

function addCategoryRow(catId, catName, catColor) {
  const tbody = document.getElementById("budget-tbody");
  // Look up avgs from already-loaded settings (categories with spending but no budget rule)
  const existing = currentSettings?.categories?.find(c => c.category_id === catId);
  const avg6 = existing?.avg_6m ?? 0;
  const avg3 = existing?.avg_3m ?? 0;
  const avg1 = existing?.avg_1m ?? 0;
  const tr = buildCatRow(catId, catName, catColor, avg6, avg3, avg1, "");
  tbody.appendChild(tr);
  tr.querySelector(".limit-input").focus();
}

document.getElementById("btn-add-cat").addEventListener("click", (e) => {
  e.stopPropagation();
  openAddCatDropdown();
});

document.addEventListener("click", () => {
  document.getElementById("cat-dropdown").classList.add("hidden");
});

document.getElementById("cat-dropdown").addEventListener("click", (e) => {
  e.stopPropagation();
});

// ── Bulk-bar event listeners ──────────────────────────────────────────────────

document.getElementById("btn-budget-select-all").addEventListener("click", () => {
  document.querySelectorAll("#budget-tbody tr[data-cat-id]").forEach(tr => {
    const chk = tr.querySelector(".budget-row-chk");
    if (chk) { chk.checked = true; toggleRowSelect(tr, true); }
  });
});

document.getElementById("btn-budget-deselect").addEventListener("click", () => {
  document.querySelectorAll("#budget-tbody tr[data-cat-id]").forEach(tr => {
    const chk = tr.querySelector(".budget-row-chk");
    if (chk) { chk.checked = false; tr.classList.remove("selected"); }
  });
  selectedCatIds.clear();
  updateBulkBar();
});

document.getElementById("btn-budget-bulk-delete").addEventListener("click", async () => {
  const n = selectedCatIds.size;
  if (!n) return;
  if (!await confirmDialog({ title: `Remove from budget`, message: `Remove ${n} categor${n === 1 ? "y" : "ies"} from budget? Their limits will be cleared.`, confirmLabel: "Remove" })) return;
  const toRemove = new Set(selectedCatIds);
  document.querySelectorAll("#budget-tbody tr[data-cat-id]").forEach(tr => {
    if (toRemove.has(tr.dataset.catId)) tr.remove();
  });
  selectedCatIds.clear();
  updateTotalHint();
  updateBulkBar();
  scheduleSave();
});

// ── Event listeners ───────────────────────────────────────────────────────────

document.getElementById("total-budget").addEventListener("input", () => {
  updateTotalHint();
  scheduleSave();
});

// ── Init ──────────────────────────────────────────────────────────────────────

async function init() {
  await loadAppSettings();
  await loadSettings();
}

init();
</script>
</body>
</html>
