<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Budget | BrokeATM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/main.css?v=19" />
  <style>
    .budget-page {
      --budget-panel-pad: 1.35rem;
      --budget-cell-pad-x: 1rem;
      --budget-metric-col-width: 14%;
      --budget-limit-col-width: 180px;
      --budget-limit-input-width: calc(var(--budget-limit-col-width) - (var(--budget-cell-pad-x) * 2));
      --budget-total-box-width-sync: var(--budget-limit-input-width);
      --budget-total-box-right-sync: var(--budget-cell-pad-x);
      --budget-column-divider: rgba(255,255,255,0.35);
    }
    .budget-page-header { display: flex; flex-direction: column; gap: 0.4rem; }
    .budget-header-meta {
      display: flex; align-items: center; justify-content: space-between;
      gap: 0.85rem 1.15rem; flex-wrap: wrap;
    }
    .budget-header-meta p { margin: 0; flex: 1 1 340px; }
    .budget-page .bulk-bar { gap: 0.75rem; padding: 0.82rem var(--budget-panel-pad); margin-bottom: 0.85rem; }
    .budget-page .bulk-count { font-size: var(--font-size-body); }
    .budget-hint-bar { align-items: center; justify-content: flex-end; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0; }
    .budget-hint-chip { margin: 0; padding: 0.48rem 0.9rem; font-size: var(--font-size-caption); border-radius: 8px; }
    .budget-table-card { margin-bottom: 1.05rem; padding: 1.05rem var(--budget-panel-pad) 0.95rem; overflow-x: auto; overflow-y: hidden; }
    .budget-table { width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed; }
    .budget-table col.chk-col { width: 42px; }
    .budget-table col.metric-col { width: var(--budget-metric-col-width); }
    .budget-table col.limit-col { width: var(--budget-limit-col-width); }
    .budget-table th {
      font-size: var(--font-size-table-head); font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.06em; color: var(--text-muted);
      padding: 0.25rem var(--budget-cell-pad-x) 0.9rem;
      text-align: left; vertical-align: bottom;
      border-bottom: 1px solid var(--border);
    }
    .budget-table td {
      padding: 0.35rem var(--budget-cell-pad-x);
      vertical-align: middle;
      border-top: 1px solid rgba(255,255,255,0.12);
      font-size: var(--font-size-table-cell);
    }
    .budget-table tr:first-child td { border-top: none; }
    .budget-table th + th, .budget-table td + td { border-left: 2px solid var(--budget-column-divider); }
    .budget-table th.num-col, .budget-table td.num-col,
    .budget-table th.limit-col, .budget-table td.limit-col { text-align: right; }
    .cat-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 0.4rem; flex-shrink: 0; }
    .budget-avg { font-family: 'JetBrains Mono', monospace; font-size: 1rem; font-weight: 600; color: var(--text-muted); }
    .limit-input {
      display: block; width: var(--budget-limit-input-width); max-width: 100%; min-width: 0; margin-left: auto;
      background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
      color: var(--text); font-size: 1rem; font-weight: 600;
      min-height: var(--control-height-sm); padding: var(--control-pad-sm-y) var(--control-pad-sm-x);
      text-align: right; transition: border-color 0.15s;
    }
    .limit-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(124,130,255,0.15); }
    .total-budget-input {
      display: block; width: 100%; max-width: 100%; min-width: 0;
      background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
      color: var(--text); font-size: 1rem; font-weight: 700;
      min-height: var(--control-height-sm); padding: var(--control-pad-sm-y) var(--control-pad-sm-x);
      text-align: right; transition: border-color 0.15s;
    }
    .total-budget-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(124,130,255,0.15); }
    .total-budget-input.invalid { border-color: var(--danger); box-shadow: 0 0 0 3px rgba(239,68,68,0.15); }
    .save-status {
      font-size: var(--font-size-caption); color: var(--text-muted);
      min-height: 0; min-width: 0; margin-left: 0.6rem;
      transition: color 0.3s; display: none;
      align-items: center; justify-content: flex-end;
      text-align: right; white-space: nowrap; flex: 0 0 auto;
    }
    .save-status:not(:empty) { display: inline-flex; }
    .save-status.saving { color: var(--text-muted); }
    .save-status.saved { color: #22c55e; }
    .save-status.error { color: var(--danger); }
    .sortable-th { cursor: pointer; user-select: none; white-space: nowrap; }
    .sortable-th:hover { color: var(--accent-hover); }
    .sortable-th.sort-active { color: var(--accent-hover); }
    .sort-icon { font-size: 0.7em; opacity: 0.7; }
    .budget-table tbody tr { position: relative; }
    .budget-table tbody tr.selected td { background: rgba(99,102,241,0.07); }
    .cat-name-cell { display: flex; align-items: center; gap: 0.35rem; min-width: 0; font-size: var(--font-size-body); font-weight: 600; }
    .cat-name-cell .cat-dot { margin-right: 0; }
    .budget-chk-wrap { display: flex; align-items: center; justify-content: center; min-height: 100%; }
    .budget-row-chk { cursor: pointer; accent-color: var(--accent); width: 16px; height: 16px; flex-shrink: 0; display: block; margin: 0 auto; }
    .budget-table th.chk-col, .budget-table td.chk-col { width: 42px; padding-left: 0; padding-right: 0.8rem; text-align: center; }
    .add-cat-wrap { display: inline-flex; }
    .add-cat-btn { min-width: 42px; padding-inline: 0; justify-content: center; font-size: 1.35rem; line-height: 1; font-weight: 700; }
    .budget-spacer { flex: 1; }
    .budget-total-shell { flex: 0 0 auto; margin-left: auto; padding-right: var(--budget-total-box-right-sync); }
    .budget-total-wrap { display: flex; align-items: center; justify-content: flex-end; }
    .budget-total-label { font-size: var(--font-size-table-head); font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; white-space: nowrap; flex: 0 0 auto; }
    .budget-total-field { display: flex; flex: 0 0 auto; align-items: center; width: var(--budget-total-box-width-sync); min-width: var(--budget-total-box-width-sync); }

    @media (max-width: 900px) {
      .budget-total-shell { flex-basis: 100%; width: 100%; padding-right: 0; padding-top: 0.7rem; border-top: 1px solid var(--budget-column-divider); }
    }
    @media (max-width: 640px) {
      .budget-table { min-width: 760px; }
      .budget-hint-bar { width: 100%; justify-content: flex-start; }
      .budget-total-wrap { flex-wrap: wrap; width: 100%; }
      .budget-total-field { flex: 1 1 100%; width: 100%; min-width: 0; }
    }
  </style>
</head>
<body>
<nav>
  <span class="nav-brand">💸 BrokeATM</span>
  <div class="nav-links">
    <a href="/">Dashboard</a>
    <a href="/records">Records</a>
    <a href="/budget" class="active">Budget</a>
    <a href="/categories">Categories</a>
    <a href="/recurring">Recurring</a>
    <a href="/import">Import</a>
    <a href="/settings">Settings</a>
  </div>
</nav>

<div class="page budget-page">
  <div class="page-header budget-page-header">
    <h1>Budget</h1>
    <div class="budget-header-meta">
      <p>Set spending limits per category and track your progress</p>
      <div id="budget-hint-bar" class="budget-hint-bar" style="display:none">
        <div id="others-hint" class="alert alert-warning budget-hint-chip"></div>
        <div id="validation-hint" class="alert alert-error budget-hint-chip" style="display:none"></div>
      </div>
    </div>
  </div>

  <div id="alerts"></div>

  <div class="bulk-bar" id="budget-bulk-bar">
    <span class="bulk-count" id="budget-bulk-count">0 selected</span>
    <button class="btn btn-ghost btn-sm" id="btn-budget-select-all">Select All</button>
    <button class="btn btn-ghost btn-sm" id="btn-budget-deselect">Clear All</button>
    <div class="bulk-divider"></div>
    <div class="add-cat-wrap">
      <button class="btn btn-ghost btn-sm add-cat-btn" id="btn-add-cat" aria-label="Add category" title="Add category">+</button>
    </div>
    <button class="btn btn-danger btn-sm" id="btn-budget-bulk-delete" disabled>Delete selected</button>
    <div class="budget-spacer"></div>
    <div class="budget-total-shell">
      <div class="budget-total-wrap">
        <span class="budget-total-label">Total budget</span>
        <div style="width:0.85rem" aria-hidden="true"></div>
        <div class="budget-total-field">
          <input type="number" class="total-budget-input" id="total-budget" min="0" step="1" placeholder="-" />
        </div>
        <div class="save-status" id="save-status"></div>
      </div>
    </div>
  </div>

  <div class="card budget-table-card">
    <table class="budget-table" id="budget-table">
      <colgroup>
        <col class="chk-col" />
        <col class="category-col" />
        <col class="metric-col" />
        <col class="metric-col" />
        <col class="metric-col" />
        <col class="limit-col" />
      </colgroup>
      <thead>
        <tr>
          <th class="chk-col"></th>
          <th class="category-col sortable-th" data-sort="name">Category <span class="sort-icon"></span></th>
          <th class="num-col sortable-th" data-sort="avg_6m">6 mo avg <span class="sort-icon"></span></th>
          <th class="num-col sortable-th" data-sort="avg_3m">3 mo avg <span class="sort-icon"></span></th>
          <th class="num-col sortable-th" data-sort="avg_1m">Last mo <span class="sort-icon"></span></th>
          <th class="limit-col sortable-th" data-sort="limit">Limit <span class="sort-icon"></span></th>
        </tr>
      </thead>
      <tbody id="budget-tbody">
        <tr><td colspan="6" style="text-align:center;padding:2rem;color:var(--text-muted)">Loading…</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script src="/static/js/utils.js?v=11"></script>
<script src="/static/js/api.js?v=8"></script>
<script src="/static/js/category-picker-modal.js?v=1"></script>
<script>
let currentSettings = null;
let saveTimer = null;
let hiddenCategoryKeys = new Set();
let budgetLayoutSyncRaf = 0;
let budgetSortCol = "avg_6m";
let budgetSortDir = "desc";
let selectedCatKeys = new Set();
let allCategories = [];

function scheduleSave() {
  const status = document.getElementById("save-status");
  status.textContent = "Saving…";
  status.className = "save-status saving";
  clearTimeout(saveTimer);
  saveTimer = setTimeout(doSave, 800);
}

async function doSave() {
  const limits = getCategoryLimits();
  const totalVal = parseFloat(document.getElementById("total-budget").value);
  const catSum = limits.reduce((s, r) => s + r.limit_amount, 0);
  const status = document.getElementById("save-status");

  if (!isNaN(totalVal) && totalVal < catSum) {
    status.textContent = `Total must be ≥ ${fmtCurrency(catSum)}`;
    status.className = "save-status error";
    return;
  }

  try {
    const r = await fetch("/api/budget/settings", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        total: isNaN(totalVal) ? null : totalVal,
        rules: limits,
        hidden_category_keys: getHiddenCategoryKeys(),
      }),
    });
    if (!r.ok) throw new Error(await r.text());
    status.textContent = "Saved";
    status.className = "save-status saved";
    setTimeout(() => { status.textContent = ""; status.className = "save-status"; }, 2000);
  } catch (e) {
    status.textContent = "Save failed";
    status.className = "save-status error";
  }
}

async function loadSettings() {
  try {
    const r = await fetch("/api/budget/settings");
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const data = await r.json();
    currentSettings = data;
    renderBudgetTable(data);
    updateTotalHint();
  } catch (e) {
    document.getElementById("budget-tbody").innerHTML =
      `<tr><td colspan="6" style="text-align:center;padding:2rem;color:var(--danger)">Failed to load: ${e.message}</td></tr>`;
  }
}

function fmtAvg(val) {
  return `<span class="budget-avg">${fmtCurrency(val, undefined, { minimumFractionDigits: 0, maximumFractionDigits: 0 })}</span>`;
}

function budgetCategoryKey(catId) {
  return catId == null || catId === "" ? "uncategorized" : `cat:${catId}`;
}

function getVisibleCategoryKeys() {
  return new Set(
    [...document.querySelectorAll("#budget-tbody tr[data-cat-key]")]
      .map(tr => tr.dataset.catKey)
      .filter(Boolean)
  );
}

function getHiddenCategoryKeys() {
  const visible = getVisibleCategoryKeys();
  return [...hiddenCategoryKeys].filter(key => key && !visible.has(key));
}

function syncBudgetTotalInputGeometry() {
  const page = document.querySelector(".budget-page");
  const bulkBar = document.getElementById("budget-bulk-bar");
  const sample = document.querySelector("#budget-tbody .limit-input");
  if (!page || !bulkBar) return;
  if (!sample) {
    page.style.removeProperty("--budget-total-box-width-sync");
    page.style.removeProperty("--budget-total-box-right-sync");
    return;
  }
  const sampleRect = sample.getBoundingClientRect();
  const bulkRect = bulkBar.getBoundingClientRect();
  const width = sampleRect.width;
  const bulkPadRight = parseFloat(getComputedStyle(bulkBar).paddingRight) || 0;
  const rightInset = Math.max(0, bulkRect.right - bulkPadRight - sampleRect.right);
  if (width > 0) {
    page.style.setProperty("--budget-total-box-width-sync", `${Math.round(width)}px`);
    page.style.setProperty("--budget-total-box-right-sync", `${Math.round(rightInset)}px`);
  }
}

function queueBudgetLayoutSync() {
  cancelAnimationFrame(budgetLayoutSyncRaf);
  budgetLayoutSyncRaf = requestAnimationFrame(syncBudgetTotalInputGeometry);
}

function updateBulkBar() {
  const n = selectedCatKeys.size;
  document.getElementById("budget-bulk-count").textContent = `${n} selected`;
  document.getElementById("btn-budget-bulk-delete").disabled = n === 0;
}

function toggleRowSelect(tr, checked) {
  const key = tr.dataset.catKey;
  if (!key) return;
  if (checked) { selectedCatKeys.add(key); tr.classList.add("selected"); }
  else { selectedCatKeys.delete(key); tr.classList.remove("selected"); }
  updateBulkBar();
}

function buildCatRow(catId, catName, catColor, avg6, avg3, avg1, limitVal) {
  const dot = catColor
    ? `<span class="cat-dot" style="background:${escHtml(catColor)}"></span>`
    : `<span class="cat-dot" style="background:var(--border)"></span>`;
  const tr = document.createElement("tr");
  tr.dataset.catId = catId ?? "";
  tr.dataset.catKey = budgetCategoryKey(catId);
  tr.innerHTML = `
    <td class="chk-col"><div class="budget-chk-wrap"><input type="checkbox" class="budget-row-chk" /></div></td>
    <td class="category-col"><div class="cat-name-cell">${dot}${escHtml(catName)}</div></td>
    <td class="num-col">${fmtAvg(avg6)}</td>
    <td class="num-col">${fmtAvg(avg3)}</td>
    <td class="num-col">${fmtAvg(avg1)}</td>
    <td class="limit-col">
      <input type="number" class="limit-input" data-cat-id="${catId ?? ""}"
        min="0" step="1" placeholder="-" value="${limitVal}" />
    </td>`;
  tr.querySelector(".limit-input").addEventListener("input", () => { updateTotalHint(); scheduleSave(); });
  tr.querySelector(".budget-row-chk").addEventListener("change", e => toggleRowSelect(tr, e.target.checked));
  return tr;
}

function syncBudgetSortHeaders() {
  document.querySelectorAll("#budget-table .sortable-th").forEach(th => {
    const col = th.dataset.sort;
    const icon = th.querySelector(".sort-icon");
    if (col === budgetSortCol) {
      th.classList.add("sort-active");
      icon.textContent = budgetSortDir === "asc" ? " ▲" : " ▼";
    } else {
      th.classList.remove("sort-active");
      icon.textContent = " ⇅";
    }
  });
}

function sortBudgetCategories(cats) {
  const dir = budgetSortDir === "asc" ? 1 : -1;
  return [...cats].sort((a, b) => {
    if (budgetSortCol === "name")
      return dir * (a.category_name || "").toLowerCase().localeCompare((b.category_name || "").toLowerCase());
    let av, bv;
    switch (budgetSortCol) {
      case "avg_6m": av = a.avg_6m ?? 0; bv = b.avg_6m ?? 0; break;
      case "avg_3m": av = a.avg_3m ?? 0; bv = b.avg_3m ?? 0; break;
      case "avg_1m": av = a.avg_1m ?? 0; bv = b.avg_1m ?? 0; break;
      case "limit":  av = a.limit_amount ?? -1; bv = b.limit_amount ?? -1; break;
      default:       av = a.avg_6m ?? 0; bv = b.avg_6m ?? 0;
    }
    return dir * (av < bv ? -1 : av > bv ? 1 : 0);
  });
}

function rebuildBudgetTbody() {
  const tbody = document.getElementById("budget-tbody");
  tbody.innerHTML = "";
  selectedCatKeys.clear();

  const visible = (currentSettings?.categories || []).filter(c => {
    const key = c.category_key || budgetCategoryKey(c.category_id);
    if (hiddenCategoryKeys.has(key)) return false;
    return (c.avg_6m ?? 0) > 0 || c.limit_amount != null;
  });

  sortBudgetCategories(visible).forEach(c => {
    tbody.appendChild(buildCatRow(
      c.category_id, c.category_name, c.category_color,
      c.avg_6m ?? 0, c.avg_3m ?? 0, c.avg_1m ?? 0,
      c.limit_amount != null ? c.limit_amount : ""
    ));
  });

  syncBudgetSortHeaders();
  updateBulkBar();
  queueBudgetLayoutSync();
}

function renderBudgetTable(data) {
  hiddenCategoryKeys = new Set(data.hidden_category_keys || []);
  document.getElementById("total-budget").value = data.total != null ? data.total : "";
  rebuildBudgetTbody();
}

function getCategoryLimits() {
  const limits = [];
  document.querySelectorAll("#budget-tbody .limit-input").forEach(el => {
    const val = parseFloat(el.value);
    const catId = el.dataset.catId;
    if (!isNaN(val) && val >= 0 && catId !== "")
      limits.push({ category_id: parseInt(catId), limit_amount: val });
  });
  return limits;
}

function updateTotalHint() {
  const limits = getCategoryLimits();
  const catSum = limits.reduce((s, r) => s + r.limit_amount, 0);
  const totalEl = document.getElementById("total-budget");
  const totalVal = parseFloat(totalEl.value);
  const hint = document.getElementById("validation-hint");
  const others = document.getElementById("others-hint");
  const hintBar = document.getElementById("budget-hint-bar");

  hint.style.display = "none";
  others.style.display = "none";
  hintBar.style.display = "none";
  totalEl.classList.remove("invalid");

  if (!isNaN(totalVal)) {
    const diff = totalVal - catSum;
    if (diff < 0) {
      hint.textContent = `Total must be ≥ category sum (${fmtCurrency(catSum)})`;
      hint.style.display = "";
      hintBar.style.display = "flex";
      totalEl.classList.add("invalid");
    } else if (diff > 0) {
      others.textContent = `${fmtCurrency(diff)} unallocated → "Others"`;
      others.style.display = "";
      hintBar.style.display = "flex";
    }
  }
}

async function loadAllCategories() {
  if (allCategories.length === 0)
    allCategories = await fetch("/api/categories").then(r => r.json());
}

function getExistingCatIds() {
  return new Set(
    [...document.querySelectorAll("#budget-tbody tr[data-cat-id]")]
      .map(tr => parseInt(tr.dataset.catId))
      .filter(id => !isNaN(id))
  );
}

function getCurrentCategoryMetaMap() {
  return new Map(
    (currentSettings?.categories || []).map(cat => [
      cat.category_key || budgetCategoryKey(cat.category_id),
      cat,
    ])
  );
}

async function getAvailableBudgetCategories() {
  await loadAllCategories();
  const existing = getExistingCatIds();
  const existingKeys = getVisibleCategoryKeys();
  const metaMap = getCurrentCategoryMetaMap();
  const missing = allCategories
    .filter(c => !existing.has(c.id))
    .map(c => {
      const category_key = budgetCategoryKey(c.id);
      const meta = metaMap.get(category_key);
      return { ...c, category_key, avg_6m: meta?.avg_6m ?? 0 };
    });
  const uncategorizedMeta = currentSettings?.categories?.find(c => c.category_id == null);
  if (uncategorizedMeta && !existingKeys.has("uncategorized")) {
    missing.push({
      id: "", name: uncategorizedMeta.category_name || "Uncategorized",
      color: uncategorizedMeta.category_color || "",
      category_key: "uncategorized", avg_6m: uncategorizedMeta.avg_6m ?? 0,
    });
  }
  return missing.sort((a, b) => {
    const d = (b.avg_6m || 0) - (a.avg_6m || 0);
    return d !== 0 ? d : String(a.name || "").localeCompare(String(b.name || ""));
  });
}

async function openCategoryPicker() {
  const items = (await getAvailableBudgetCategories()).map(item => ({
    id: item.category_key === "uncategorized" ? null : item.id,
    value: item.category_key,
    key: item.category_key,
    name: item.name,
    color: item.color || "",
    description: Number(item.avg_6m || 0) > 0
      ? `6 mo avg ${fmtCurrency(item.avg_6m, undefined, { minimumFractionDigits: 0, maximumFractionDigits: 0 })}`
      : "No recent spending",
    actionText: "Add",
  }));
  return openCategoryPickerModal({
    title: "Add category",
    subtitle: "Search categories and add them back into this budget table.",
    searchPlaceholder: "Search categories...",
    items,
    actionLabel: "Add",
    emptyMessage: "All categories are already in this budget.",
    noResultsMessage: query => `No categories match "${query}".`,
  });
}

function addCategoryRow(catId, catName, catColor) {
  const existing = currentSettings?.categories?.find(c =>
    (catId == null && c.category_id == null) || c.category_id === catId
  );
  hiddenCategoryKeys.delete(budgetCategoryKey(catId));
  const tr = buildCatRow(catId, catName, catColor, existing?.avg_6m ?? 0, existing?.avg_3m ?? 0, existing?.avg_1m ?? 0, "");
  document.getElementById("budget-tbody").appendChild(tr);
  updateTotalHint();
  scheduleSave();
  queueBudgetLayoutSync();
  tr.querySelector(".limit-input").focus();
}

document.getElementById("btn-add-cat").addEventListener("click", async e => {
  e.stopPropagation();
  try {
    const picked = await openCategoryPicker();
    if (!picked) return;
    addCategoryRow(picked.id, picked.name, picked.color || null);
  } catch (err) {
    showAlert(document.getElementById("alerts"), err?.message || "Could not load categories.", "error");
  }
});

document.getElementById("btn-budget-select-all").addEventListener("click", () => {
  document.querySelectorAll("#budget-tbody tr[data-cat-id]").forEach(tr => {
    const chk = tr.querySelector(".budget-row-chk");
    if (chk) { chk.checked = true; toggleRowSelect(tr, true); }
  });
});

document.getElementById("btn-budget-deselect").addEventListener("click", () => {
  document.querySelectorAll("#budget-tbody tr[data-cat-id]").forEach(tr => {
    const chk = tr.querySelector(".budget-row-chk");
    if (chk) { chk.checked = false; tr.classList.remove("selected"); }
  });
  selectedCatKeys.clear();
  updateBulkBar();
});

document.getElementById("btn-budget-bulk-delete").addEventListener("click", async () => {
  const n = selectedCatKeys.size;
  if (!n) return;
  if (!await confirmDialog({ title: "Remove from budget", message: `Remove ${n} categor${n === 1 ? "y" : "ies"} from budget? Their limits will be cleared.`, confirmLabel: "Remove" })) return;
  const toRemove = new Set(selectedCatKeys);
  toRemove.forEach(key => hiddenCategoryKeys.add(key));
  document.querySelectorAll("#budget-tbody tr[data-cat-key]").forEach(tr => {
    if (toRemove.has(tr.dataset.catKey)) tr.remove();
  });
  selectedCatKeys.clear();
  updateTotalHint();
  updateBulkBar();
  scheduleSave();
  queueBudgetLayoutSync();
});

document.getElementById("total-budget").addEventListener("input", () => {
  updateTotalHint();
  scheduleSave();
});

document.querySelectorAll("#budget-table .sortable-th").forEach(th => {
  th.addEventListener("click", () => {
    const col = th.dataset.sort;
    if (budgetSortCol === col) {
      budgetSortDir = budgetSortDir === "asc" ? "desc" : "asc";
    } else {
      budgetSortCol = col;
      budgetSortDir = col === "name" ? "asc" : "desc";
    }
    rebuildBudgetTbody();
  });
});

window.addEventListener("resize", queueBudgetLayoutSync);
window.addEventListener("load", queueBudgetLayoutSync);

async function init() {
  await loadAppSettings();
  await loadSettings();
}

init();
</script>
</body>
</html>
