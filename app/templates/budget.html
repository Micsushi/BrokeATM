<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Budget | BrokeATM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/main.css?v=5" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <style>
    .budget-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
      align-items: start;
    }
    @media (max-width: 900px) { .budget-grid { grid-template-columns: 1fr; } }

    /* Category budget table */
    .budget-table { width: 100%; border-collapse: collapse; }
    .budget-table th {
      font-size: 0.72rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.06em; color: var(--text-muted);
      padding: 0 0.5rem 0.6rem; text-align: left;
    }
    .budget-table th.right { text-align: right; }
    .budget-table td { padding: 0.45rem 0.5rem; vertical-align: middle; border-top: 1px solid rgba(255,255,255,0.04); }
    .budget-table tr:first-child td { border-top: none; }
    .cat-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 0.4rem; flex-shrink: 0; }
    .avg-bar-wrap { width: 80px; height: 6px; background: var(--surface2); border-radius: 3px; display: inline-block; vertical-align: middle; }
    .avg-bar { height: 100%; border-radius: 3px; background: var(--accent); max-width: 100%; }
    .limit-input {
      width: 90px; background: var(--surface2); border: 1px solid var(--border);
      border-radius: 6px; color: var(--text); font-size: 0.84rem;
      padding: 0.28rem 0.5rem; text-align: right;
      transition: border-color 0.15s;
    }
    .limit-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(124,130,255,0.15); }
    .limit-input.over-avg { border-color: rgba(239,68,68,0.5); }
    .total-row td { border-top: 2px solid var(--border) !important; font-weight: 700; padding-top: 0.75rem; }
    .total-budget-input {
      width: 110px; background: var(--surface2); border: 1px solid var(--border);
      border-radius: 6px; color: var(--text); font-size: 0.9rem; font-weight: 700;
      padding: 0.35rem 0.6rem; text-align: right;
      transition: border-color 0.15s;
    }
    .total-budget-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(124,130,255,0.15); }
    .total-budget-input.invalid { border-color: var(--danger); box-shadow: 0 0 0 3px rgba(239,68,68,0.15); }
    .validation-hint { font-size: 0.78rem; color: var(--danger); margin-top: 0.5rem; min-height: 1.1em; }
    .others-hint { font-size: 0.78rem; color: var(--text-muted); margin-top: 0.3rem; }

    /* Performance chart card */
    .perf-month-chips { display: flex; gap: 0.4rem; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
    .perf-month-chips::-webkit-scrollbar { display: none; }

    /* Progress bars for category breakdown */
    .cat-progress-list { display: flex; flex-direction: column; gap: 0.6rem; margin-top: 0.75rem; }
    .cat-progress-row { display: flex; flex-direction: column; gap: 0.2rem; }
    .cat-progress-header { display: flex; justify-content: space-between; font-size: 0.8rem; }
    .cat-progress-name { color: var(--text); font-weight: 500; display: flex; align-items: center; gap: 0.35rem; }
    .cat-progress-amounts { color: var(--text-muted); font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; }
    .cat-progress-track { height: 8px; background: var(--surface2); border-radius: 4px; overflow: hidden; }
    .cat-progress-fill { height: 100%; border-radius: 4px; transition: width 0.4s ease; }
    .cat-progress-fill.under { background: #22c55e; }
    .cat-progress-fill.over { background: var(--danger); }
  </style>
</head>
<body>
<nav>
  <span class="nav-brand">💸 BrokeATM</span>
  <div class="nav-links">
    <a href="/">Dashboard</a>
    <a href="/records">Records</a>
    <a href="/budget" class="active">Budget</a>
    <a href="/categories">Categories</a>
    <a href="/import">Import</a>
    <a href="/settings">Settings</a>
  </div>
</nav>

<div class="page">
  <div class="page-header">
    <div>
      <h1>Budget</h1>
      <p>Set spending limits per category and track your progress</p>
    </div>
    <button class="btn btn-primary" id="btn-save">Save budgets</button>
  </div>

  <div id="alerts"></div>

  <div class="budget-grid">
    <!-- ── LEFT: Set budgets ───────────────────────────────────── -->
    <div class="card">
      <div class="picker-card-header" style="margin-bottom:0.75rem">
        <span class="section-title">Category limits</span>
        <div style="display:flex;align-items:center;gap:0.5rem">
          <span style="font-size:0.8rem;color:var(--text-muted)">Avg over</span>
          <select id="avg-months-sel" style="background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:0.8rem;padding:0.25rem 0.5rem">
            <option value="1">1 month</option>
            <option value="3" selected>3 months</option>
            <option value="6">6 months</option>
            <option value="12">12 months</option>
          </select>
        </div>
      </div>

      <table class="budget-table" id="budget-table">
        <thead>
          <tr>
            <th>Category</th>
            <th class="right">Avg / mo</th>
            <th style="width:32px"></th>
            <th class="right">Limit</th>
          </tr>
        </thead>
        <tbody id="budget-tbody">
          <tr><td colspan="4" style="text-align:center;padding:2rem;color:var(--text-muted)">Loading…</td></tr>
        </tbody>
        <tfoot>
          <tr class="total-row">
            <td colspan="2">
              <span style="font-size:0.85rem">Total budget</span>
              <div class="validation-hint" id="validation-hint"></div>
              <div class="others-hint" id="others-hint"></div>
            </td>
            <td></td>
            <td style="text-align:right">
              <input type="number" class="total-budget-input" id="total-budget" min="0" step="1" placeholder="—" />
            </td>
          </tr>
        </tfoot>
      </table>
    </div>

    <!-- ── RIGHT: Performance chart ───────────────────────────── -->
    <div class="card">
      <div class="picker-card-header" style="margin-bottom:0.75rem">
        <span class="section-title">Monthly performance</span>
        <div style="display:flex;align-items:center;gap:0.5rem">
          <span style="font-size:0.8rem;color:var(--text-muted)">Last</span>
          <select id="perf-months-sel" style="background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:0.8rem;padding:0.25rem 0.5rem">
            <option value="3">3 months</option>
            <option value="6" selected>6 months</option>
            <option value="12">12 months</option>
          </select>
        </div>
      </div>
      <div style="position:relative;height:220px">
        <canvas id="perf-chart"></canvas>
      </div>
      <div id="no-budget-hint" style="display:none;text-align:center;padding:2rem 1rem;color:var(--text-muted);font-size:0.85rem">
        Set a total budget to see performance tracking.
      </div>
      <div class="cat-progress-list" id="cat-progress-list"></div>
    </div>
  </div>
</div>

<script src="/static/js/utils.js?v=6"></script>
<script src="/static/js/api.js?v=6"></script>
<script>
Chart.defaults.color = "#8892b0";
Chart.defaults.borderColor = "#2e3250";

let perfChart = null;
let currentSettings = null;  // { total, categories[] }
let summaryData = null;

// ── Load settings (left panel) ────────────────────────────────────────────────

async function loadSettings() {
  const months = document.getElementById("avg-months-sel").value;
  const data = await fetch(`/api/budget/settings?avg_months=${months}`).then(r => r.json());
  currentSettings = data;
  renderBudgetTable(data);
  updateTotalHint();
}

function renderBudgetTable(data) {
  const tbody = document.getElementById("budget-tbody");

  // Max avg for scaling bars
  const maxAvg = Math.max(...data.categories.map(c => c.avg_monthly), 1);

  tbody.innerHTML = data.categories.map(c => {
    const pct = Math.min((c.avg_monthly / maxAvg) * 100, 100);
    const dot = c.category_color
      ? `<span class="cat-dot" style="background:${escHtml(c.category_color)}"></span>`
      : `<span class="cat-dot" style="background:var(--border)"></span>`;
    const limitVal = c.limit_amount != null ? c.limit_amount : "";
    return `
      <tr data-cat-id="${c.category_id ?? ""}">
        <td>${dot}${escHtml(c.category_name)}</td>
        <td style="text-align:right;font-family:'JetBrains Mono',monospace;font-size:0.8rem;color:var(--text-muted)">
          $${c.avg_monthly.toFixed(0)}
        </td>
        <td>
          <div class="avg-bar-wrap"><div class="avg-bar" style="width:${pct}%"></div></div>
        </td>
        <td style="text-align:right">
          <input type="number" class="limit-input" data-cat-id="${c.category_id ?? ""}"
            min="0" step="1" placeholder="—" value="${limitVal}" />
        </td>
      </tr>`;
  }).join("");

  // Restore total budget
  const totalEl = document.getElementById("total-budget");
  if (data.total != null) totalEl.value = data.total;

  // Live validation on input changes
  tbody.querySelectorAll(".limit-input").forEach(el =>
    el.addEventListener("input", updateTotalHint)
  );
}

function getCategoryLimits() {
  const limits = [];
  document.querySelectorAll("#budget-tbody .limit-input").forEach(el => {
    const val = parseFloat(el.value);
    const catId = el.dataset.catId;
    if (!isNaN(val) && val >= 0 && catId !== "") {
      limits.push({ category_id: parseInt(catId), limit_amount: val });
    }
  });
  return limits;
}

function updateTotalHint() {
  const limits = getCategoryLimits();
  const catSum = limits.reduce((s, r) => s + r.limit_amount, 0);
  const totalEl = document.getElementById("total-budget");
  const totalVal = parseFloat(totalEl.value);
  const hint = document.getElementById("validation-hint");
  const others = document.getElementById("others-hint");

  if (!isNaN(totalVal)) {
    const diff = totalVal - catSum;
    if (diff < 0) {
      hint.textContent = `Total must be ≥ category sum ($${catSum.toFixed(2)})`;
      totalEl.classList.add("invalid");
      others.textContent = "";
    } else {
      hint.textContent = "";
      totalEl.classList.remove("invalid");
      others.textContent = diff > 0
        ? `$${diff.toFixed(2)} unallocated → "Others"`
        : "No unallocated budget";
    }
  } else {
    hint.textContent = "";
    totalEl.classList.remove("invalid");
    others.textContent = "";
  }
}

// ── Save ──────────────────────────────────────────────────────────────────────

document.getElementById("btn-save").addEventListener("click", async () => {
  const limits = getCategoryLimits();
  const totalVal = parseFloat(document.getElementById("total-budget").value);
  const catSum = limits.reduce((s, r) => s + r.limit_amount, 0);

  if (!isNaN(totalVal) && totalVal < catSum) {
    showAlert(document.getElementById("alerts"),
      `Total budget ($${totalVal.toFixed(2)}) must be ≥ sum of category limits ($${catSum.toFixed(2)})`, "error");
    return;
  }

  try {
    await fetch("/api/budget/settings", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        total: isNaN(totalVal) ? null : totalVal,
        rules: limits,
      }),
    }).then(async r => {
      if (!r.ok) throw new Error(await r.text());
    });
    showAlert(document.getElementById("alerts"), "Budget saved.", "success");
    loadSummary();
  } catch (e) {
    showAlert(document.getElementById("alerts"), e.message, "error");
  }
});

// ── Load performance summary (right panel) ────────────────────────────────────

async function loadSummary() {
  const months = document.getElementById("perf-months-sel").value;
  const data = await fetch(`/api/budget/summary?months=${months}`).then(r => r.json());
  summaryData = data;
  renderPerfChart(data);
  renderCatProgress(data);
}

function renderPerfChart(data) {
  const hasBudget = data.total_budget != null;
  document.getElementById("no-budget-hint").style.display = hasBudget ? "none" : "";

  const labels = data.monthly.map(m => m.label);
  const spent = data.monthly.map(m => m.total_spent);
  const budget = data.total_budget;

  const barColors = data.monthly.map(m =>
    budget != null && m.total_spent > budget
      ? "rgba(239,68,68,0.75)"
      : "rgba(124,130,255,0.7)"
  );

  const datasets = [{
    label: "Total Spent",
    data: spent,
    backgroundColor: barColors,
    borderRadius: 5,
    borderSkipped: false,
  }];

  if (budget != null) {
    datasets.push({
      label: "Budget",
      data: Array(labels.length).fill(budget),
      type: "line",
      borderColor: "rgba(34,197,94,0.8)",
      borderWidth: 2,
      borderDash: [6, 3],
      pointRadius: 0,
      fill: false,
    });
  }

  const ctx = document.getElementById("perf-chart").getContext("2d");
  if (perfChart) perfChart.destroy();
  perfChart = new Chart(ctx, {
    type: "bar",
    data: { labels, datasets },
    options: {
      maintainAspectRatio: false,
      plugins: {
        legend: { display: budget != null, position: "top", labels: { boxWidth: 12, font: { size: 11 } } },
        tooltip: {
          callbacks: {
            label: ctx => ` $${ctx.parsed.y.toFixed(2)}`,
          },
        },
      },
      scales: {
        x: { grid: { display: false } },
        y: {
          beginAtZero: true,
          ticks: { callback: v => `$${v}` },
        },
      },
    },
  });
}

function renderCatProgress(data) {
  const list = document.getElementById("cat-progress-list");

  // Aggregate across shown months
  const totals = {};
  for (const mo of data.monthly) {
    for (const item of mo.items) {
      const k = item.category_id;
      if (!totals[k]) totals[k] = { name: item.category_name, spent: 0, budget: item.budget * data.monthly.length };
      totals[k].spent += item.spent;
    }
  }

  const entries = Object.values(totals).sort((a, b) => b.spent - a.spent);
  if (entries.length === 0) {
    list.innerHTML = '<p style="font-size:0.82rem;color:var(--text-muted);margin-top:0.5rem">No category budgets set yet.</p>';
    return;
  }

  list.innerHTML = entries.map(e => {
    const pct = e.budget > 0 ? Math.min((e.spent / e.budget) * 100, 100) : 0;
    const over = e.budget > 0 && e.spent > e.budget;
    return `
      <div class="cat-progress-row">
        <div class="cat-progress-header">
          <span class="cat-progress-name">${escHtml(e.name)}</span>
          <span class="cat-progress-amounts">$${e.spent.toFixed(0)} / $${e.budget.toFixed(0)}</span>
        </div>
        <div class="cat-progress-track">
          <div class="cat-progress-fill ${over ? "over" : "under"}" style="width:${pct}%"></div>
        </div>
      </div>`;
  }).join("");
}

// ── Event listeners ───────────────────────────────────────────────────────────

document.getElementById("avg-months-sel").addEventListener("change", loadSettings);
document.getElementById("perf-months-sel").addEventListener("change", loadSummary);
document.getElementById("total-budget").addEventListener("input", updateTotalHint);

// ── Init ──────────────────────────────────────────────────────────────────────

Promise.all([loadSettings(), loadSummary()]);
</script>
</body>
</html>
