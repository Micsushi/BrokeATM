<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Budget | BrokeATM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/main.css?v=8" />
  <style>
    /* Category budget table */
    .budget-table { width: 100%; border-collapse: collapse; }
    .budget-table th {
      font-size: 0.72rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.06em; color: var(--text-muted);
      padding: 0 0.5rem 0.6rem; text-align: left;
    }
    .budget-table th.right { text-align: right; }
    .budget-table td { padding: 0.45rem 0.5rem; vertical-align: middle; border-top: 1px solid rgba(255,255,255,0.04); }
    .budget-table tr:first-child td { border-top: none; }
    .cat-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 0.4rem; flex-shrink: 0; }
    .limit-input {
      width: 90px; background: var(--surface2); border: 1px solid var(--border);
      border-radius: 6px; color: var(--text); font-size: 0.84rem;
      padding: 0.28rem 0.5rem; text-align: right;
      transition: border-color 0.15s;
    }
    .limit-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(124,130,255,0.15); }
    .total-row td { border-top: 2px solid var(--border) !important; font-weight: 700; padding-top: 0.75rem; }
    .total-budget-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
    }
    .total-budget-meta {
      flex: 1;
      min-width: 0;
    }
    .total-budget-field {
      flex-shrink: 0;
      text-align: right;
    }
    .total-budget-input {
      width: 110px; background: var(--surface2); border: 1px solid var(--border);
      border-radius: 6px; color: var(--text); font-size: 0.9rem; font-weight: 700;
      padding: 0.35rem 0.6rem; text-align: right;
      transition: border-color 0.15s;
    }
    .total-budget-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(124,130,255,0.15); }
    .total-budget-input.invalid { border-color: var(--danger); box-shadow: 0 0 0 3px rgba(239,68,68,0.15); }
    .validation-hint { font-size: 0.78rem; color: var(--danger); margin-top: 0.5rem; min-height: 1.1em; }
    .others-hint { font-size: 0.78rem; color: var(--text-muted); margin-top: 0.3rem; }
    .save-status { font-size: 0.78rem; color: var(--text-muted); margin-top: 0.4rem; min-height: 1.1em; transition: color 0.3s; }
    .save-status.saving { color: var(--text-muted); }
    .save-status.saved { color: #22c55e; }
    .save-status.error { color: var(--danger); }
    @media (max-width: 700px) {
      .total-budget-row { flex-direction: column; align-items: stretch; }
      .total-budget-field { text-align: left; }
    }
  </style>
</head>
<body>
<nav>
  <span class="nav-brand">💸 BrokeATM</span>
  <div class="nav-links">
    <a href="/">Dashboard</a>
    <a href="/records">Records</a>
    <a href="/budget" class="active">Budget</a>
    <a href="/categories">Categories</a>
    <a href="/import">Import</a>
    <a href="/settings">Settings</a>
  </div>
</nav>

<div class="page">
  <div class="page-header">
    <div>
      <h1>Budget</h1>
      <p>Set spending limits per category and track your progress</p>
    </div>
  </div>

  <div id="alerts"></div>

  <!-- ── TOP: Category limits ───────────────────────────────────────── -->
  <div class="card" style="margin-bottom:1.25rem">
    <div class="picker-card-header" style="margin-bottom:0.75rem">
      <span class="section-title">Category limits</span>
    </div>

    <table class="budget-table" id="budget-table">
      <thead>
        <tr>
          <th>Category</th>
          <th class="right">6 mo avg</th>
          <th class="right">3 mo avg</th>
          <th class="right">Last mo</th>
          <th class="right">Limit</th>
        </tr>
      </thead>
      <tbody id="budget-tbody">
        <tr><td colspan="5" style="text-align:center;padding:2rem;color:var(--text-muted)">Loading…</td></tr>
      </tbody>
      <tfoot>
        <tr class="total-row">
          <td colspan="5">
            <div class="total-budget-row">
              <div class="total-budget-meta">
                <span style="font-size:0.85rem">Total budget</span>
                <div class="save-status" id="save-status"></div>
                <div class="validation-hint" id="validation-hint"></div>
                <div class="others-hint" id="others-hint"></div>
              </div>
              <div class="total-budget-field">
                <input type="number" class="total-budget-input" id="total-budget" min="0" step="1" placeholder="—" />
              </div>
            </div>
          </td>
        </tr>
      </tfoot>
    </table>
  </div>

</div>

<script src="/static/js/utils.js?v=7"></script>
<script src="/static/js/api.js?v=7"></script>
<script>
let currentSettings = null;
let saveTimer = null;

// ── Auto-save (debounced 800ms) ────────────────────────────────────────────────

function scheduleSave() {
  const status = document.getElementById("save-status");
  status.textContent = "Saving…";
  status.className = "save-status saving";
  clearTimeout(saveTimer);
  saveTimer = setTimeout(doSave, 800);
}

async function doSave() {
  const limits = getCategoryLimits();
  const totalVal = parseFloat(document.getElementById("total-budget").value);
  const catSum = limits.reduce((s, r) => s + r.limit_amount, 0);
  const status = document.getElementById("save-status");

  if (!isNaN(totalVal) && totalVal < catSum) {
    status.textContent = `Total must be ≥ ${fmtCurrency(catSum)}`;
    status.className = "save-status error";
    return;
  }

  try {
    const r = await fetch("/api/budget/settings", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        total: isNaN(totalVal) ? null : totalVal,
        rules: limits,
      }),
    });
    if (!r.ok) throw new Error(await r.text());
    status.textContent = "Saved";
    status.className = "save-status saved";
    setTimeout(() => { status.textContent = ""; status.className = "save-status"; }, 2000);
  } catch (e) {
    status.textContent = "Save failed";
    status.className = "save-status error";
  }
}

// ── Load settings (top panel) ─────────────────────────────────────────────────

async function loadSettings() {
  const data = await fetch(`/api/budget/settings`).then(r => r.json());
  currentSettings = data;
  renderBudgetTable(data);
  updateTotalHint();
}

function fmtAvg(val) {
  return `<span style="font-family:'JetBrains Mono',monospace;font-size:0.8rem;color:var(--text-muted)">${fmtCurrency(val, undefined, { minimumFractionDigits: 0, maximumFractionDigits: 0 })}</span>`;
}

function renderBudgetTable(data) {
  const tbody = document.getElementById("budget-tbody");

  tbody.innerHTML = data.categories.map(c => {
    const dot = c.category_color
      ? `<span class="cat-dot" style="background:${escHtml(c.category_color)}"></span>`
      : `<span class="cat-dot" style="background:var(--border)"></span>`;
    const limitVal = c.limit_amount != null ? c.limit_amount : "";
    const avg6 = c.avg_6m ?? c.avg_monthly ?? 0;
    const avg3 = c.avg_3m ?? 0;
    const avg1 = c.avg_1m ?? 0;
    return `
      <tr data-cat-id="${c.category_id ?? ""}">
        <td>${dot}${escHtml(c.category_name)}</td>
        <td style="text-align:right">${fmtAvg(avg6)}</td>
        <td style="text-align:right">${fmtAvg(avg3)}</td>
        <td style="text-align:right">${fmtAvg(avg1)}</td>
        <td style="text-align:right">
          <input type="number" class="limit-input" data-cat-id="${c.category_id ?? ""}"
            min="0" step="1" placeholder="—" value="${limitVal}" />
        </td>
      </tr>`;
  }).join("");

  const totalEl = document.getElementById("total-budget");
  if (data.total != null) totalEl.value = data.total;

  tbody.querySelectorAll(".limit-input").forEach(el =>
    el.addEventListener("input", () => { updateTotalHint(); scheduleSave(); })
  );
}

function getCategoryLimits() {
  const limits = [];
  document.querySelectorAll("#budget-tbody .limit-input").forEach(el => {
    const val = parseFloat(el.value);
    const catId = el.dataset.catId;
    if (!isNaN(val) && val >= 0 && catId !== "") {
      limits.push({ category_id: parseInt(catId), limit_amount: val });
    }
  });
  return limits;
}

function updateTotalHint() {
  const limits = getCategoryLimits();
  const catSum = limits.reduce((s, r) => s + r.limit_amount, 0);
  const totalEl = document.getElementById("total-budget");
  const totalVal = parseFloat(totalEl.value);
  const hint = document.getElementById("validation-hint");
  const others = document.getElementById("others-hint");

  if (!isNaN(totalVal)) {
    const diff = totalVal - catSum;
    if (diff < 0) {
      hint.textContent = `Total must be ≥ category sum (${fmtCurrency(catSum)})`;
      totalEl.classList.add("invalid");
      others.textContent = "";
    } else {
      hint.textContent = "";
      totalEl.classList.remove("invalid");
      others.textContent = diff > 0
        ? `${fmtCurrency(diff)} unallocated → "Others"`
        : "No unallocated budget";
    }
  } else {
    hint.textContent = "";
    totalEl.classList.remove("invalid");
    others.textContent = "";
  }
}

// ── Event listeners ───────────────────────────────────────────────────────────

document.getElementById("total-budget").addEventListener("input", () => {
  updateTotalHint();
  scheduleSave();
});

// ── Init ──────────────────────────────────────────────────────────────────────

async function init() {
  await loadAppSettings();
  await loadSettings();
}

init();
</script>
</body>
</html>
