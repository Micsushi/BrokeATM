<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recurring | BrokeATM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/main.css?v=19" />
  <style>
    .recurring-page { padding-top: 1.3rem; }
    .recurring-page .page-header { margin-bottom: 0.95rem; }

    /* table — mirrors records.html sizing */
    .card-flush { padding: 0; }
    .recurring-table-wrap { overflow-x: auto; }
    #recurring-table { width: 100%; border-collapse: separate; border-spacing: 0; }
    #recurring-table th {
      padding: 0.7rem 0.9rem;
      font-size: var(--font-size-table-head);
      font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.06em; color: var(--text-muted);
      text-align: left; border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    #recurring-table td {
      padding: 0.58rem 0.9rem;
      font-size: 0.93rem;
      border-top: 1px solid rgba(255,255,255,0.07);
      vertical-align: middle;
    }
    #recurring-table tr:first-child td { border-top: none; }
    #recurring-table tr:hover td { background: rgba(255,255,255,0.03); }
    #recurring-table .amount-cell { font-family: 'JetBrains Mono', monospace; font-weight: 600; }
    #recurring-table .actions-cell { white-space: nowrap; text-align: right; }
    #recurring-table .actions-cell .btn { min-height: 34px; padding: 0.24rem 0.72rem; font-size: 0.86rem; }
    .freq-badge {
      display: inline-block; padding: 0.22rem 0.58rem; border-radius: 6px;
      font-size: 0.76rem; font-weight: 600; text-transform: capitalize;
      background: var(--surface2); color: var(--text-muted); border: 1px solid var(--border);
    }
    .cat-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 0.4rem; vertical-align: middle; }
    .empty-state { text-align: center; padding: 3.5rem 1rem; color: var(--text-muted); }
    .empty-state p { margin: 0; }

    /* edit / delete modals — match add-tx-modal exactly */
    .modal label { display: block; margin-bottom: 0.28rem; font-size: 0.82rem; font-weight: 600; color: var(--text-muted); }
    .modal input[type="text"],
    .modal input[type="number"],
    .modal input[type="date"],
    .modal select,
    .modal textarea {
      width: 100%; background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); font-size: 0.93rem;
      padding: 0.45rem 0.75rem; min-height: 38px; box-sizing: border-box;
    }
    .modal input:focus, .modal select:focus, .modal textarea:focus {
      outline: none; border-color: var(--accent);
    }
    .modal textarea { min-height: 64px; resize: vertical; }
    .form-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    .form-3col { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.75rem; }
    .form-group { display: flex; flex-direction: column; gap: 0; }
    .form-group + .form-group,
    .form-2col + .form-group,
    .form-2col + .form-2col,
    .form-3col + .form-2col,
    .form-group + .form-2col { margin-top: 0.75rem; }

    .overlap-warning {
      background: rgba(251,191,36,0.1); border: 1px solid rgba(251,191,36,0.35);
      border-radius: 8px; padding: 0.75rem 1rem; margin-bottom: 0.75rem;
      font-size: 0.87rem; color: #fbbf24;
    }
    .overlap-warning strong { display: block; margin-bottom: 0.4rem; }
    .overlap-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  </style>
</head>
<body>
<nav>
  <span class="nav-brand">💸 BrokeATM</span>
  <div class="nav-links">
    <a href="/">Dashboard</a>
    <a href="/records">Records</a>
    <a href="/budget">Budget</a>
    <a href="/categories">Categories</a>
    <a href="/recurring" class="active">Recurring</a>
    <a href="/import">Import</a>
    <a href="/settings">Settings</a>
  </div>
</nav>

<div class="page recurring-page">
  <div class="page-header flex items-center justify-between">
    <div>
      <h1>Recurring Entries</h1>
      <p>Auto-generated transactions on a repeating schedule</p>
    </div>
    <button class="btn btn-primary" id="add-rule-btn">+ Add Entry</button>
  </div>

  <div id="alerts"></div>

  <div class="card card-flush">
    <div class="recurring-table-wrap">
      <table id="recurring-table">
        <thead>
          <tr>
            <th>Merchant</th>
            <th>Amount</th>
            <th>Type</th>
            <th>Frequency</th>
            <th>Start</th>
            <th>End</th>
            <th>Category</th>
            <th>Account</th>
            <th style="text-align:center">Entries</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="recurring-tbody">
          <tr><td colspan="10"><div class="empty-state"><p>Loading…</p></div></td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Edit Modal -->
<div class="modal-overlay hidden" id="edit-modal">
  <div class="modal">
    <h2>Edit Recurring Rule</h2>
    <div id="edit-alerts"></div>
    <div id="edit-overlap-warning" class="overlap-warning" style="display:none">
      <strong id="edit-overlap-msg"></strong>
      <div class="overlap-actions">
        <button class="btn btn-sm btn-secondary" id="overlap-keep-btn">Keep existing entries</button>
        <button class="btn btn-sm btn-danger" id="overlap-remove-btn">Remove entries after new end date</button>
      </div>
    </div>
    <div style="display:grid;gap:0.75rem">
      <div class="form-2col">
        <div class="form-group">
          <label>Merchant / Description <span style="color:var(--danger)">*</span></label>
          <input type="text" id="e-merchant" />
        </div>
        <div class="form-group">
          <label>Amount <span style="color:var(--danger)">*</span></label>
          <input type="number" id="e-amount" step="0.01" min="0" />
        </div>
      </div>
      <div class="form-3col">
        <div class="form-group">
          <label>Type</label>
          <select id="e-type">
            <option value="expense">Expense</option>
            <option value="income">Income</option>
            <option value="refund">Refund</option>
            <option value="transfer">Transfer</option>
          </select>
        </div>
        <div class="form-group">
          <label>Frequency</label>
          <select id="e-frequency">
            <option value="monthly">Monthly</option>
            <option value="weekly">Weekly</option>
            <option value="biweekly">Bi-weekly</option>
            <option value="yearly">Yearly</option>
          </select>
        </div>
        <div class="form-group">
          <label>Currency</label>
          <input type="text" id="e-currency" maxlength="3" style="text-transform:uppercase" />
        </div>
      </div>
      <div class="form-2col">
        <div class="form-group">
          <label>Category</label>
          <select id="e-category"></select>
        </div>
        <div class="form-group">
          <label>Account</label>
          <select id="e-account"></select>
        </div>
      </div>
      <div class="form-2col">
        <div class="form-group">
          <label>Start date</label>
          <input type="date" id="e-start-date" disabled style="opacity:0.5;cursor:not-allowed" />
        </div>
        <div class="form-group">
          <label>End date <span style="font-weight:400;color:var(--text-muted)">(blank = ongoing)</span></label>
          <input type="date" id="e-end-date" />
        </div>
      </div>
      <div class="form-group">
        <label>Notes</label>
        <textarea id="e-notes" placeholder="Optional note…"></textarea>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="edit-cancel">Cancel</button>
      <button class="btn btn-primary" id="edit-save">Save Changes</button>
    </div>
  </div>
</div>

<!-- Delete Confirm Modal -->
<div class="modal-overlay hidden" id="delete-modal">
  <div class="modal" style="max-width:420px">
    <h2>Delete Recurring Rule</h2>
    <p id="delete-desc" style="color:var(--text-muted);font-size:0.93rem;margin:0.6rem 0 1rem"></p>
    <div id="delete-alerts"></div>
    <div style="display:flex;flex-direction:column;gap:0.85rem;margin-bottom:1.1rem">
      <label style="display:flex;align-items:flex-start;gap:0.55rem;cursor:pointer;font-size:0.93rem;font-weight:600">
        <input type="radio" name="del-mode" value="all" checked style="margin-top:0.2rem;accent-color:var(--accent)" />
        Delete rule + all linked entries <span id="tx-count-badge" style="font-weight:400;color:var(--text-muted);margin-left:0.25rem"></span>
      </label>
      <label style="display:flex;align-items:flex-start;gap:0.55rem;cursor:pointer;font-size:0.93rem;font-weight:600">
        <input type="radio" name="del-mode" value="from" style="margin-top:0.2rem;accent-color:var(--accent)" />
        Delete from a specific date onwards
      </label>
      <div id="from-date-section" style="display:none;padding-left:1.55rem">
        <label style="font-size:0.82rem;font-weight:600;color:var(--text-muted);margin-bottom:0.28rem;display:block">From date (inclusive)</label>
        <input type="date" id="del-from-date" style="width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:0.93rem;padding:0.45rem 0.75rem;min-height:38px" />
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="delete-cancel">Cancel</button>
      <button class="btn btn-danger" id="delete-confirm">Delete</button>
    </div>
  </div>
</div>

<script src="/static/js/utils.js?v=11"></script>
<script src="/static/js/api.js?v=5"></script>
<script src="/static/js/category-picker-modal.js?v=1"></script>
<script src="/static/js/category-create-modal.js?v=2"></script>
<script src="/static/js/add-tx-modal.js?v=5"></script>
<script>
(function () {
  let rules = [];
  let categories = [];
  let accounts = [];
  let editingRuleId = null;
  let pendingOverlapPayload = null;

  const FREQ_LABELS = { monthly: 'Monthly', weekly: 'Weekly', biweekly: 'Bi-weekly', yearly: 'Yearly' };
  const alertsEl = document.getElementById('alerts');

  // ---- data ----

  async function loadAll() {
    [rules, categories, accounts] = await Promise.all([
      API.getRecurringRules(),
      API.getCategories(),
      API.getAccounts(),
    ]);
    renderTable();
  }

  function populateCategorySelect(sel) {
    const cur = sel.value;
    sel.innerHTML = '<option value="">No category</option>';
    categories.forEach(c => {
      const o = document.createElement('option');
      o.value = c.id;
      o.textContent = c.name;
      sel.appendChild(o);
    });
    if (cur) sel.value = cur;
  }

  function populateAccountSelect(sel) {
    const cur = sel.value;
    sel.innerHTML = '<option value="">No account</option>';
    accounts.forEach(a => {
      const o = document.createElement('option');
      o.value = a.id;
      o.textContent = a.name + (a.card_number_masked ? ' ' + a.card_number_masked : '');
      sel.appendChild(o);
    });
    if (cur) sel.value = cur;
  }

  // ---- render ----

  function renderTable() {
    const tbody = document.getElementById('recurring-tbody');
    if (!rules.length) {
      tbody.innerHTML = `<tr><td colspan="10"><div class="empty-state">
        <p>No recurring rules yet. Click <strong>+ Add Entry</strong> to create one.</p>
      </div></td></tr>`;
      return;
    }

    tbody.innerHTML = rules.map(r => {
      const cat = categories.find(c => c.id === r.category_id);
      const catDot = cat?.color ? `<span class="cat-dot" style="background:${escHtml(cat.color)}"></span>` : '';
      const catName = r.category_name || '—';
      const accName = r.account_name || '—';
      return `<tr>
        <td><strong>${escHtml(r.merchant_name)}</strong></td>
        <td class="amount-cell">${fmtCurrency(r.amount, r.currency)} <small style="color:var(--text-muted)">${escHtml(r.currency)}</small></td>
        <td>${typeBadge(r.transaction_type)}</td>
        <td><span class="freq-badge">${FREQ_LABELS[r.frequency] || r.frequency}</span></td>
        <td>${escHtml(r.start_date)}</td>
        <td>${r.end_date ? escHtml(r.end_date) : '<span style="color:var(--text-muted)">Ongoing</span>'}</td>
        <td>${catDot}${escHtml(catName)}</td>
        <td>${escHtml(accName)}</td>
        <td style="text-align:center">${r.transaction_count}</td>
        <td class="actions-cell">
          <button class="btn btn-secondary" onclick="openEditModal(${r.id})">Edit</button>
          <button class="btn btn-danger" onclick="openDeleteModal(${r.id})" style="margin-left:0.3rem">Delete</button>
        </td>
      </tr>`;
    }).join('');
  }

  // ---- add (delegate to add-tx-modal) ----

  document.getElementById('add-rule-btn').addEventListener('click', () => {
    openAddTxModal({
      recurringDefault: true,
      onSuccess: async (count, isRecurring) => {
        await loadAll();
        if (isRecurring) {
          showAlert(alertsEl, `Recurring rule created — ${count} entr${count === 1 ? 'y' : 'ies'} generated.`, 'success');
        }
      },
    });
  });

  // ---- edit modal ----

  window.openEditModal = function (id) {
    const rule = rules.find(r => r.id === id);
    if (!rule) return;
    editingRuleId = id;
    pendingOverlapPayload = null;

    populateCategorySelect(document.getElementById('e-category'));
    populateAccountSelect(document.getElementById('e-account'));

    document.getElementById('e-merchant').value = rule.merchant_name;
    document.getElementById('e-amount').value = rule.amount;
    document.getElementById('e-type').value = rule.transaction_type;
    document.getElementById('e-frequency').value = rule.frequency;
    document.getElementById('e-currency').value = rule.currency;
    document.getElementById('e-start-date').value = rule.start_date;
    document.getElementById('e-end-date').value = rule.end_date || '';
    document.getElementById('e-category').value = rule.category_id || '';
    document.getElementById('e-account').value = rule.account_id || '';
    document.getElementById('e-notes').value = rule.notes || '';

    document.getElementById('edit-overlap-warning').style.display = 'none';
    document.getElementById('edit-alerts').innerHTML = '';
    document.getElementById('edit-modal').classList.remove('hidden');
    document.getElementById('e-merchant').focus();
  };

  function closeEditModal() {
    document.getElementById('edit-modal').classList.add('hidden');
    editingRuleId = null;
    pendingOverlapPayload = null;
  }

  function collectEditPayload() {
    const merchant = document.getElementById('e-merchant').value.trim();
    const amount = parseFloat(document.getElementById('e-amount').value);
    if (!merchant) { showAlert(document.getElementById('edit-alerts'), 'Merchant name is required.', 'error'); return null; }
    if (isNaN(amount) || amount < 0) { showAlert(document.getElementById('edit-alerts'), 'Enter a valid amount.', 'error'); return null; }
    const catVal = document.getElementById('e-category').value;
    const accVal = document.getElementById('e-account').value;
    const endVal = document.getElementById('e-end-date').value;
    return {
      merchant_name: merchant,
      amount: amount,
      transaction_type: document.getElementById('e-type').value,
      currency: (document.getElementById('e-currency').value.trim() || 'CAD').toUpperCase(),
      frequency: document.getElementById('e-frequency').value,
      end_date: endVal || null,
      category_id: catVal ? parseInt(catVal) : null,
      account_id: accVal ? parseInt(accVal) : null,
      notes: document.getElementById('e-notes').value.trim() || null,
    };
  }

  async function saveEdit(extraFlags = {}) {
    const payload = collectEditPayload();
    if (!payload) return;
    const btn = document.getElementById('edit-save');
    btn.disabled = true;
    btn.textContent = 'Saving…';
    try {
      await API.updateRecurringRule(editingRuleId, { ...payload, ...extraFlags });
      closeEditModal();
      await loadAll();
      showAlert(alertsEl, 'Rule updated.', 'success');
    } catch (err) {
      if (err.overlap) {
        pendingOverlapPayload = payload;
        document.getElementById('edit-overlap-msg').textContent = err.overlap.message;
        document.getElementById('edit-overlap-warning').style.display = 'block';
      } else {
        showAlert(document.getElementById('edit-alerts'), err.message || 'Error saving rule.', 'error');
      }
    } finally {
      btn.disabled = false;
      btn.textContent = 'Save Changes';
    }
  }

  document.getElementById('edit-save').addEventListener('click', () => saveEdit());
  document.getElementById('edit-cancel').addEventListener('click', closeEditModal);
  document.getElementById('edit-modal').addEventListener('click', e => {
    if (e.target === document.getElementById('edit-modal')) closeEditModal();
  });
  document.getElementById('overlap-keep-btn').addEventListener('click', async () => {
    const btn = document.getElementById('overlap-keep-btn');
    btn.disabled = true;
    await saveEdit({ keep_overlap: true });
    btn.disabled = false;
  });
  document.getElementById('overlap-remove-btn').addEventListener('click', async () => {
    const btn = document.getElementById('overlap-remove-btn');
    btn.disabled = true;
    await saveEdit({ force_remove_overlap: true });
    btn.disabled = false;
  });

  // ---- delete modal ----

  let deletingRuleId = null;

  window.openDeleteModal = function (id) {
    deletingRuleId = id;
    const rule = rules.find(r => r.id === id);
    document.getElementById('delete-desc').textContent =
      `"${rule?.merchant_name}" — ${rule?.transaction_count || 0} linked transaction(s)`;
    document.getElementById('tx-count-badge').textContent = `(${rule?.transaction_count || 0})`;
    document.querySelector('input[name="del-mode"][value="all"]').checked = true;
    document.getElementById('from-date-section').style.display = 'none';
    document.getElementById('del-from-date').value = '';
    document.getElementById('delete-alerts').innerHTML = '';
    document.getElementById('delete-modal').classList.remove('hidden');
  };

  function closeDeleteModal() {
    document.getElementById('delete-modal').classList.add('hidden');
    deletingRuleId = null;
  }

  document.getElementById('delete-cancel').addEventListener('click', closeDeleteModal);
  document.getElementById('delete-modal').addEventListener('click', e => {
    if (e.target === document.getElementById('delete-modal')) closeDeleteModal();
  });
  document.querySelectorAll('input[name="del-mode"]').forEach(radio => {
    radio.addEventListener('change', () => {
      document.getElementById('from-date-section').style.display =
        radio.value === 'from' ? 'block' : 'none';
    });
  });

  document.getElementById('delete-confirm').addEventListener('click', async () => {
    if (!deletingRuleId) return;
    const mode = document.querySelector('input[name="del-mode"]:checked').value;
    const btn = document.getElementById('delete-confirm');
    btn.disabled = true;
    btn.textContent = 'Deleting…';
    try {
      if (mode === 'all') {
        await API.deleteRecurringRule(deletingRuleId);
        closeDeleteModal();
        await loadAll();
        showAlert(alertsEl, 'Rule and all linked entries deleted.', 'success');
      } else {
        const fromDate = document.getElementById('del-from-date').value;
        if (!fromDate) {
          showAlert(document.getElementById('delete-alerts'), 'Select a from date.', 'error');
          return;
        }
        const res = await API.deleteRecurringRuleFrom(deletingRuleId, fromDate);
        closeDeleteModal();
        await loadAll();
        showAlert(alertsEl, `Deleted ${res.deleted} entries from ${fromDate} onwards.`, 'success');
      }
    } catch (err) {
      showAlert(document.getElementById('delete-alerts'), err.message || 'Delete failed.', 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Delete';
    }
  });

  // ---- init ----
  loadAll();
})();
</script>
</body>
</html>
