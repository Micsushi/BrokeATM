name: Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install app dependencies
        run: python -m pip install -e ".[dev,build]"

      - name: Run packaging-focused tests
        run: python -m pytest tests/test_cli.py

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Build Windows executable and installer
        shell: powershell
        run: .\scripts\build_windows.ps1 -Installer -Python python

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BrokeATM-windows-${{ github.ref_name }}
          path: |
            dist/installer/BrokeATM-Setup.exe
            dist/BrokeATM/BrokeATM.exe
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/installer/BrokeATM-Setup.exe
