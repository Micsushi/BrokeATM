[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brokeatm"
version = "0.1.0"
description = "BrokeATM: personal budget and expense tracker with CSV import and web dashboard"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "python-multipart>=0.0.9",
    "aiofiles>=23.2.1",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pdfplumber>=0.10.0",
    "ofxtools>=0.9.0",
    "camelot-py[cv]>=0.11.0",
    "tabula-py>=2.9.0",
    "pytesseract>=0.3.10",
    "pdf2image>=1.17.0",
    "pymupdf>=1.24.0",
    "easyocr>=1.7.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = [
    "data/*.json",
    "static/css/*.css",
    "static/js/*.js",
    "templates/*.html",
]

[project.scripts]
atm = "app.cli:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]
build = [
    "pyinstaller>=6.0.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN401", "B008"]

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["ANN"]
"app/api/*" = ["ANN"]
"app/main.py" = ["ANN"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
